# must be unique in a given SonarQube instance
sonar.projectKey=service-discover
sonar.projectName=service-discover
# Go only: the JS/YAML/IaC sensors started on catalog-info.yaml get the jnlp container killed
sonar.inclusions=**/*.go
sonar.exclusions=**/*_test.go,test/**
sonar.test.inclusions=**/*_test.go
sonar.go.golangci-lint.reportPaths=linter.out
sonar.go.coverage.reportPaths=pkg/encrypter/coverage.out,pkg/exec/coverage.out,pkg/formatter/coverage.out,pkg/parser/coverage.out,pkg/carbonio/coverage.out,pkg/spire/coverage.out,pkg/permissions/coverage.out,cmd/service-discoverd/coverage.out,pkg/legacytoken/coverage.out,pkg/term/coverage.out,pkg/mesh/coverage.out,pkg/meshcmd/coverage.out,pkg/command/coverage.out,cmd/agent/coverage.out,cmd/server/coverage.out
