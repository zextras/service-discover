# must be unique in a given SonarQube instance
sonar.projectKey=service-discover
sonar.projectName=service-discover
sonar.exclusions=**/*_test.go,test/**
sonar.test.inclusions=**/*_test.go
sonar.go.golangci-lint.reportPaths=linter.out
sonar.go.coverage.reportPaths=pkg/encrypter/coverage.out,pkg/exec/coverage.out,pkg/formatter/coverage.out,pkg/parser/coverage.out,pkg/carbonio/coverage.out,pkg/command/coverage.out,cmd/agent/coverage.out,cmd/server/coverage.out
